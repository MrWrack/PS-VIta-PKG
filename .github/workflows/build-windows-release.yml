name: Build Windows EXE

on:
  workflow_dispatch:
  push:
    paths:
      - 'pc/vpk_manager_pc.py'
      - 'pc/vpk_manager_pc.ico'
      - '.github/workflows/build-windows-release.yml'

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install pinned PyInstaller
        run: |
          python -m pip install --upgrade pip
          python -m pip install "pyinstaller==6.16.0"

      - name: Build standalone GUI EXE
        working-directory: pc
        run: >-
          python -m PyInstaller
          --noconfirm
          --clean
          --onefile
          --windowed
          --noupx
          --log-level WARN
          --name "VPK Manager PC"
          --icon vpk_manager_pc.ico
          vpk_manager_pc.py

      - name: Prepare release artifact
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release | Out-Null
          Copy-Item "pc\dist\VPK Manager PC.exe" "release\VPK Manager PC.exe"

      - name: Scan release with Microsoft Defender
        shell: pwsh
        run: |
          & "$env:ProgramFiles\Windows Defender\MpCmdRun.exe" -Scan -ScanType 3 -File "$pwd\release\VPK Manager PC.exe"
          if ($LASTEXITCODE -ne 0) { throw "Microsoft Defender rejected the release EXE." }

      - name: Write SHA-256 checksum
        shell: pwsh
        run: |
          (Get-FileHash "release\VPK Manager PC.exe" -Algorithm SHA256).Hash.ToLower() + "  VPK Manager PC.exe" | Set-Content "release\SHA256.txt"

      - name: Upload standalone EXE
        uses: actions/upload-artifact@v4
        with:
          name: VPK-Manager-PC-Windows
          path: |
            release/VPK Manager PC.exe
            release/SHA256.txt
          if-no-files-found: error
          compression-level: 0
