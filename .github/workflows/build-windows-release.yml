name: Build Windows EXE

on:
  workflow_dispatch:
  push:
    paths:
      - 'pc/vpk_manager_pc.py'
      - 'pc/vpk_manager_pc.ico'
      - '.github/workflows/build-windows-release.yml'

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install PyInstaller
        run: python -m pip install --upgrade pip pyinstaller

      - name: Build standalone GUI EXE
        working-directory: pc
        run: >-
          python -m PyInstaller
          --noconfirm
          --clean
          --onefile
          --windowed
          --name "VPK Manager PC"
          --icon vpk_manager_pc.ico
          vpk_manager_pc.py

      - name: Prepare release artifact
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release | Out-Null
          Copy-Item "pc\dist\VPK Manager PC.exe" "release\VPK Manager PC.exe"

      - name: Upload standalone EXE
        uses: actions/upload-artifact@v4
        with:
          name: VPK-Manager-PC-Windows
          path: release/VPK Manager PC.exe
          if-no-files-found: error
          compression-level: 0
