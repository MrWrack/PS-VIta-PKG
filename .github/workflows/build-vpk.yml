name: Build VPK Manager

on:
  workflow_dispatch:
  push:
    branches: [ "main", "master" ]
    paths:
      - "src/**"
      - "pkg/**"
      - "CMakeLists.txt"
      - ".github/workflows/build-vpk.yml"
  pull_request:
    paths:
      - "src/**"
      - "pkg/**"
      - "CMakeLists.txt"
      - ".github/workflows/build-vpk.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: vitasdk/vitasdk:latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch Vita package head template
        run: |
          mkdir -p resources
          curl -L --fail --retry 3 \
            https://github.com/TheOfficialFloW/VitaShell/raw/refs/heads/master/resources/head.bin \
            -o resources/head.bin
          test -s resources/head.bin
          ls -lh resources/head.bin

      - name: Configure
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build VPK
        run: |
          cmake --build build --parallel

      - name: Repack VPK in tested Vita-safe format
        run: |
          python3 tools/repack_vpk_uncompressed.py build/VPKManager.vpk

      - name: Verify VPK output
        run: |
          test -f build/VPKManager.vpk
          python3 - <<'PYVERIFY'
          import zipfile
          from pathlib import Path
          p = Path('build/VPKManager.vpk')
          with zipfile.ZipFile(p, 'r') as z:
              bad = [i.filename for i in z.infolist() if i.compress_type != zipfile.ZIP_STORED]
              if bad:
                  raise SystemExit('Compressed entries remain: ' + ', '.join(bad))
              required = {'eboot.bin', 'sce_sys/param.sfo', 'sce_sys/icon0.png'}
              missing = required - set(z.namelist())
              if missing:
                  raise SystemExit('Missing VPK files: ' + ', '.join(sorted(missing)))
          print('VPK structure verified and all entries are uncompressed.')
          PYVERIFY
          ls -lh build/VPKManager.vpk

      - name: Upload VPKManager.vpk
        uses: actions/upload-artifact@v4
        with:
          name: VPKManager-v5-PS-Vita
          path: build/VPKManager.vpk
          if-no-files-found: error
          retention-days: 30
